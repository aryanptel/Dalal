# ─────────────────────────────────────────────────────────────────────────────
#  Web Chat Orchestrator — Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Selectors may need updating if platforms change their DOM structure.

browser:
  # Which browser to use: "edge" or "brave"
  use: "edge"
  remote_debugging_port: 9222
  remote_debugging_url: "http://localhost:9222"
  # Auto-launch the browser in debug mode when starting the tool?
  auto_launch: true
  # Separate profile folder so your normal browser isn't affected
  user_data_dir_windows: "C:\\selenium\\AutomationProfile"
  user_data_dir_mac: "/tmp/orchestrator_browser_profile"

  # Browser executable paths (auto-detected if left empty)
  paths:
    edge:
      windows:
        - "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
        - "C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe"
      mac:
        - "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"
    brave:
      windows:
        - "C:\\Program Files\\BraveSoftware\\Brave-Browser\\Application\\brave.exe"
        - "C:\\Program Files (x86)\\BraveSoftware\\Brave-Browser\\Application\\brave.exe"
      mac:
        - "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"

# Stability tuning
timing:
  typing_delay_ms: 12          # milliseconds between keystrokes for organic feel
  stability_wait_s: 2.0        # seconds to confirm response text stopped growing
  stability_samples: 3         # consecutive stable samples needed
  max_response_wait_s: 360     # hard timeout waiting for response (6 min)
  post_send_delay_s: 1.0       # pause after clicking send before polling
  network_idle_timeout_s: 2.0  # wait for network to idle after generation

# Export settings
export_directory: "exports"

platforms:
  chatgpt:
    url: "https://chatgpt.com/"
    file_input_selector: "input[type='file']"
    attach_button_selector: "button[aria-label='Attach files'], button[data-testid='composer-attach-button'], button[aria-label='Upload file']"
    # ChatGPT uses a contenteditable div with id prompt-textarea (or ProseMirror)
    input_selector: "div#prompt-textarea, div.ProseMirror, [contenteditable='true'][data-placeholder], textarea[placeholder]"
    stop_button: "[data-testid='stop-button'], button[aria-label='Stop generating'], button[aria-label='Stop']"
    send_button: "[data-testid='send-button'], button[aria-label='Send prompt'], button[data-testid='composer-send-button']"
    response_selector: "[data-message-author-role='assistant'], div.agent-turn, div.markdown"
    new_chat_button: "a[data-testid='create-new-chat-button'], nav a[href='/']"

  claude:
    url: "https://claude.ai/new"
    file_input_selector: "input[type='file']"
    attach_button_selector: "button[aria-label='Attach file'], button[aria-label='Add content'], button[aria-label='Attach files']"
    # Claude uses contenteditable divs, sometimes with ProseMirror
    input_selector: "div[contenteditable='true'].ProseMirror, div[contenteditable='true'], [role='textbox'], fieldset div[contenteditable='true']"
    stop_button: "button[aria-label='Stop Response'], button:has-text('Stop'), button[aria-label='Stop']"
    send_button: "button[aria-label='Send Message'], button[aria-label='Send'], button:has(> svg[viewBox])"
    # Only select Claude's final Markdown, never the temporary "Thinking" status.
    response_selector: "[data-is-streaming] .standard-markdown, [data-is-streaming] .progressive-markdown"
    new_chat_button: "a[href='/new'], button:has-text('New chat')"

  gemini:
    url: "https://gemini.google.com/"
    file_input_selector: "input[type='file']"
    attach_button_selector: "button[aria-label='Add files'], button[aria-label='Upload file'], button[aria-label='Add image']"
    # Gemini uses a rich-textarea custom element with contenteditable inside
    input_selector: "rich-textarea div[contenteditable='true'], div[contenteditable='true'][aria-label*='prompt'], .ql-editor, div[contenteditable='true']"
    stop_button: "button[aria-label='Stop'], button.stop-button, button:has-text('Stop')"
    send_button: "button.send-button, button[aria-label='Send message'], button[aria-label='Send']"
    response_selector: "model-response, message-content, .response-container, .model-response-text"
    new_chat_button: "button[aria-label='New chat'], a[href='/app']"

  deepseek:
    url: "https://chat.deepseek.com/"
    file_input_selector: "input[type='file']"
    attach_button_selector: "button[aria-label='Upload file'], div[class*='upload'] button"
    # DeepSeek uses a textarea or contenteditable
    input_selector: "textarea#chat-input, textarea[placeholder*='Message'], textarea[placeholder*='message'], div[contenteditable='true'], textarea"
    stop_button: "button:has-text('Stop'), div[class*='stop'], button[aria-label='Stop']"
    send_button: "div[aria-label='Send message'], div[role='button'][aria-label='Send'], div[class*='send'] button, button[aria-label='Send'], div[role='button'][class*='send']"
    response_selector: ".markdown-body, div[class*='message-content'], div[class*='assistant'], div[class*='markdown']"
    new_chat_button: "a[href='/'], button:has-text('New chat'), div[class*='new-chat']"

  kimi:
    url: "https://kimi.moonshot.cn/"
    file_input_selector: "input[type='file']"
    input_selector: "div[contenteditable='true'], textarea"
    stop_button: "button[aria-label*='stop'], button:has-text('Stop')"
    send_button: "div[role='button'][aria-label*='send'], button[aria-label*='send'], div[class*='send'] button"
    response_selector: "div[class*='markdown'], div.message-content"
    new_chat_button: "div:has-text('New Chat'), button[aria-label='New Chat'], a[href='/']"

  huggingchat:
    url: "https://huggingface.co/chat/"
    file_input_selector: "input[type='file']"
    input_selector: "textarea[placeholder*='Ask anything'], textarea"
    stop_button: "button:has-text('Stop generating')"
    send_button: "button[type='submit'], button[aria-label*='Send']"
    response_selector: "div.prose"
    new_chat_button: "form[action='/chat/'] button, a[href='/chat/']"

  metaai:
    url: "https://www.meta.ai/"
    file_input_selector: "input[type='file']"
    input_selector: "textarea[placeholder*='Ask Meta AI'], div[contenteditable='true'], textarea"
    stop_button: "button[aria-label*='Stop'], button:has-text('Stop')"
    send_button: "button[aria-label*='Send'], div[role='button'][aria-label*='Send']"
    response_selector: "div[role='article'], div.markdown"
    new_chat_button: "a[href='/'], button[aria-label*='New chat']"
